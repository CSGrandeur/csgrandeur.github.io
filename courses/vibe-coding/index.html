<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI氛围编程 · 课次目录</title>
  <style>
    :root {
      --bg: #eef2f8;
      --card: #fff;
      --ink: #141c2c;
      --muted: #5a6573;
      --line: #d5dce6;
      --accent: #003592;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbe7ff 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #eef2f6 0%, transparent 50%),
        var(--bg);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    header { margin-bottom: 0.35rem; }
    .kicker {
      margin: 0 0 0.4rem;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.85rem;
      line-height: 1.25;
    }
    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .act {
      margin: 1.45rem 0 0.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .grid {
      display: grid;
      gap: 0.65rem;
    }
    .card {
      display: grid;
      grid-template-columns: 3rem 1fr auto;
      gap: 0.85rem;
      align-items: center;
      padding: 0.85rem 1rem;
      border: 1px solid var(--line);
      background: var(--card);
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    a.card:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0, 53, 146, 0.08);
    }
    .card.busy { opacity: 0.7; pointer-events: none; }
    .card.is-soon { opacity: 0.62; }
    .id {
      font-family: "IBM Plex Mono", "Sarasa Mono SC", ui-monospace, Consolas, monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent);
    }
    .body { min-width: 0; display: flex; flex-direction: column; gap: 0.2rem; }
    .title { font-weight: 650; font-size: 1rem; }
    .sub {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .go { color: var(--accent); font-size: 0.88rem; white-space: nowrap; }
    .card.is-soon .go { color: var(--muted); }
    .preview { font-size: 0.75rem; color: #8a5a00; font-weight: 600; }
    .status {
      margin-top: 1rem;
      min-height: 1.25rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">人工智能学院 · Vibe Coding</p>
      <h1>AI氛围编程</h1>
      <p class="note">课件随学期进度逐章更新。</p>
    </header>
    <p class="act">课前</p>
    <div class="grid">
      <a class="card" data-id="00" href="./00/">
        <span class="id">00</span>
        <span class="body">
          <span class="title">课前学习</span>
          <span class="sub">编程课、基本功、助手与判断力</span>
        </span>
        <span class="go">进入</span>
      </a>
    </div>
    <p class="status" id="status"></p>
  </main>
  <script>
/**
 * 课内片字体：空闲后再向 fastly.jsdelivr 拉 woff2。
 * 不阻塞首屏。失败或超时都继续用 tokens.css 里的系统字体。
 */
;(function loadVcFonts() {
  if (typeof document === 'undefined')
    return
  if (window.__vcFontsStarted)
    return
  window.__vcFontsStarted = 1

  var CDN = 'https://fastly.jsdelivr.net/npm/'
  var LATIN = 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD'
  var FACES = [
    ['Noto Sans SC', '400', '@fontsource/noto-sans-sc@5.2.8/files/noto-sans-sc-chinese-simplified-400-normal.woff2', ''],
    ['Noto Sans SC', '600', '@fontsource/noto-sans-sc@5.2.8/files/noto-sans-sc-chinese-simplified-600-normal.woff2', ''],
    ['Noto Sans SC', '700', '@fontsource/noto-sans-sc@5.2.8/files/noto-sans-sc-chinese-simplified-700-normal.woff2', ''],
    ['Noto Serif SC', '600', '@fontsource/noto-serif-sc@5.2.8/files/noto-serif-sc-chinese-simplified-600-normal.woff2', ''],
    ['IBM Plex Sans', '400', '@fontsource/ibm-plex-sans@5.2.6/files/ibm-plex-sans-latin-400-normal.woff2', LATIN],
    ['IBM Plex Sans', '600', '@fontsource/ibm-plex-sans@5.2.6/files/ibm-plex-sans-latin-600-normal.woff2', LATIN],
    ['IBM Plex Mono', '400', '@fontsource/ibm-plex-mono@5.2.6/files/ibm-plex-mono-latin-400-normal.woff2', LATIN],
    ['IBM Plex Mono', '700', '@fontsource/ibm-plex-mono@5.2.6/files/ibm-plex-mono-latin-700-normal.woff2', LATIN],
  ]

  function inject() {
    if (document.querySelector('style[data-vc-fonts]'))
      return
    var css = ''
    for (var i = 0; i < FACES.length; i++) {
      var f = FACES[i]
      css += '@font-face{font-family:"' + f[0] + '";font-style:normal;font-weight:' + f[1]
        + ';font-display:swap;src:url("' + CDN + f[2] + '") format("woff2");'
        + (f[3] ? 'unicode-range:' + f[3] + ';' : '')
        + '}'
    }
    var el = document.createElement('style')
    el.setAttribute('data-vc-fonts', '')
    el.textContent = css
    document.head.appendChild(el)
  }

  function start() {
    try {
      inject()
    }
    catch (_) { /* 系统字体继续用 */ }
  }

  function whenIdle(fn) {
    if (typeof requestIdleCallback === 'function')
      requestIdleCallback(fn, { timeout: 2500 })
    else
      setTimeout(fn, 1)
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', function () { whenIdle(start) }, { once: true })
  else
    whenIdle(start)
})()

  </script>
  <script>
    const MODE = window.__HUB_MODE__ || 'static'
    const statusEl = document.getElementById('status')
    const cards = document.querySelectorAll('a.card')

    function setStatus(text) {
      statusEl.textContent = text || ''
    }

    if (MODE === 'dev') {
      for (const card of cards) {
        card.addEventListener('click', async (ev) => {
          ev.preventDefault()
          const id = card.dataset.id
          card.classList.add('busy')
          setStatus('正在启动第 ' + id + ' 课 Slidev…')
          try {
            const res = await fetch('/api/open/' + id, { method: 'POST' })
            const data = await res.json()
            if (!res.ok) throw new Error(data.error || '启动失败')
            setStatus('已就绪，正在打开…')
            window.location.href = data.url
          } catch (err) {
            setStatus(String(err.message || err))
            card.classList.remove('busy')
          }
        })
      }
    }
  </script>
</body>
</html>
