    :root {
      --ink: #141414;
      --muted: #555;
      --rule: #141414;
      --hair: #d9d4cc;
      --tint: #f5f2ec;
      --acc: #e4501a;
      --acc-t: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "VC Latin", "VC Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-weight: 500;
      color: var(--ink);
      background: #fff;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    header {
      border-bottom: 3px solid var(--rule);
      padding-bottom: 1rem;
      margin-bottom: 0.5rem;
    }
    .kicker {
      margin: 0 0 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 0.4rem;
      font-family: "VC Serif", "Noto Serif SC", "Songti SC", serif;
      font-weight: 900;
      font-size: 2.6rem;
      line-height: 1.2;
    }
    .note { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .act {
      margin: 2rem 0 0;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--rule);
      font-family: "VC Serif", "Noto Serif SC", serif;
      font-weight: 900;
      font-size: 1.1rem;
    }
    .grid { display: grid; }
    .card {
      display: grid;
      grid-template-columns: 3.2rem 1fr auto;
      gap: 1rem;
      align-items: baseline;
      padding: 0.9rem 0.25rem;
      border-bottom: 1px solid var(--hair);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { background: var(--tint); }
    a.card:hover .title { color: var(--acc-t); }
    .card.busy { opacity: 0.6; pointer-events: none; }
    .card.is-soon { opacity: 0.5; }
    .id {
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--acc-t);
      font-variant-numeric: tabular-nums;
    }
    .body { min-width: 0; display: flex; flex-direction: column; gap: 0.25rem; }
    .title {
      font-family: "VC Serif", "Noto Serif SC", serif;
      font-weight: 900;
      font-size: 1.2rem;
    }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .go { color: var(--acc-t); font-size: 0.9rem; font-weight: 600; white-space: nowrap; }
    .card.is-soon .go { color: var(--muted); }
    .preview { font-family: "VC Sans", sans-serif; font-size: 0.75rem; color: var(--acc-t); font-weight: 500; margin-left: 0.4rem; }
    .status { margin-top: 1rem; min-height: 1.25rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>

  <script>
    const MODE = window.__HUB_MODE__ || 'static'
    const statusEl = document.getElementById('status')
    const cards = document.querySelectorAll('a.card')

    function setStatus(text) {
      statusEl.textContent = text || ''
    }

    if (MODE === 'dev') {
      for (const card of cards) {
        card.addEventListener('click', async (ev) => {
          ev.preventDefault()
          const id = card.dataset.id
          card.classList.add('busy')
          setStatus('正在启动第 ' + id + ' 课 Slidev…')
          try {
            const res = await fetch('/api/open/' + id, { method: 'POST' })
            const data = await res.json()
            if (!res.ok) throw new Error(data.error || '启动失败')
            setStatus('已就绪，正在打开…')
            window.location.href = data.url
          } catch (err) {
            setStatus(String(err.message || err))
            card.classList.remove('busy')
          }
        })
      }
    }
  </script>
</body>
</html>
