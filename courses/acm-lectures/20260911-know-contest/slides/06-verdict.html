<section data-chapter-zh="竞赛">
  <div class="deck-sheet deck-sheet--lec">
    <header class="deck-head">
      <p class="slide-kicker">竞赛</p>
      <h2 class="slide-title">评测结果</h2>
    </header>
    <div class="slide-body lec-verdicts lec-verdicts--six">
      <div class="lec-verdicts__card lec-verdicts__card--ok">
        <p class="lec-verdicts__code">AC</p>
        <p class="lec-verdicts__zh">通过</p>
        <p class="lec-verdicts__p">全部隐藏测试正确，该题记为通过。</p>
      </div>
      <div class="lec-verdicts__card lec-verdicts__card--wa">
        <p class="lec-verdicts__code">WA</p>
        <p class="lec-verdicts__zh">答案错误</p>
        <p class="lec-verdicts__p">至少一组数据输出不正确。样例通过仍可能 WA。</p>
      </div>
      <div class="lec-verdicts__card lec-verdicts__card--tle">
        <p class="lec-verdicts__code">TLE</p>
        <p class="lec-verdicts__zh">超时</p>
        <p class="lec-verdicts__p">结果可能正确，但未能在时限内运行完毕。</p>
      </div>
      <div class="lec-verdicts__card lec-verdicts__card--mle">
        <p class="lec-verdicts__code">MLE</p>
        <p class="lec-verdicts__zh">内存超限</p>
        <p class="lec-verdicts__p">占用内存超过题目限制。</p>
      </div>
      <div class="lec-verdicts__card lec-verdicts__card--re">
        <p class="lec-verdicts__code">RE</p>
        <p class="lec-verdicts__zh">运行错误</p>
        <p class="lec-verdicts__p">运行中崩溃，例如除零、越界。</p>
      </div>
      <div class="lec-verdicts__card lec-verdicts__card--ce">
        <p class="lec-verdicts__code">CE</p>
        <p class="lec-verdicts__zh">编译错误</p>
        <p class="lec-verdicts__p">未能编译通过，评测系统不会运行。</p>
      </div>
    </div>
  </div>
</section>
