<section data-chapter-zh="竞赛">
  <div class="deck-sheet deck-sheet--lec">
    <header class="deck-head">
      <p class="slide-kicker">竞赛</p>
      <h2 class="slide-title">相同的商连成一段</h2>
    </header>
    <div class="slide-body lec-divsum lec-divsum--ans">
      <div class="lec-divsum__text">
        <p>同一商从 i 连到 j。</p>
        <p class="lec-divsum__math">j = <span class="lec-floor">n / <span class="lec-floor">n/i</span></span>，个数 = j − i + 1</p>
        <p>用不等式证明，证明略。</p>
        <p>i = 4：<span class="lec-floor">11/4</span> = 2，j = <span class="lec-floor">11/2</span> = 5。</p>
        <p>i = 6：<span class="lec-floor">11/6</span> = 1，j = <span class="lec-floor">11/1</span> = 11。</p>
        <table class="lec-divsum__tbl">
          <thead>
            <tr>
              <th>i</th>
              <th>商</th>
              <th>j</th>
              <th>个数</th>
              <th>小计</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>11</td>
              <td>1</td>
              <td>1</td>
              <td>11</td>
            </tr>
            <tr>
              <td>2</td>
              <td>5</td>
              <td>2</td>
              <td>1</td>
              <td>5</td>
            </tr>
            <tr>
              <td>3</td>
              <td>3</td>
              <td>3</td>
              <td>1</td>
              <td>3</td>
            </tr>
            <tr>
              <td>4</td>
              <td>2</td>
              <td>5</td>
              <td>2</td>
              <td>4</td>
            </tr>
            <tr>
              <td>6</td>
              <td>1</td>
              <td>11</td>
              <td>6</td>
              <td>6</td>
            </tr>
          </tbody>
        </table>
        <p class="lec-divsum__sum">11×1 + 5×1 + 3×1 + 2×2 + 1×6 = 29</p>
      </div>
      <figure class="lec-divsum__fig">
        <img src="/assets/image/div-sum-n11-ans.svg" alt="n 等于 11 时整数商五段，并标出左右端" width="640" height="380" />
        <ol class="lec-divsum__chips lec-divsum__chips--grouped" aria-label="按连续相同的商分组">
          <li class="is-a">11</li>
          <li class="is-b">5</li>
          <li class="is-c">3</li>
          <li class="is-d">2</li>
          <li class="is-d">2</li>
          <li class="is-e">1</li>
          <li class="is-e">1</li>
          <li class="is-e">1</li>
          <li class="is-e">1</li>
          <li class="is-e">1</li>
          <li class="is-e">1</li>
        </ol>
      </figure>
    </div>
  </div>
</section>
